[platformio]
default_envs = mega2560, esp32c3

[env]
framework = arduino
monitor_speed = 115200
build_flags = -DBENCH_MODEL=-1

[env:mega2560]
platform = atmelavr@5.1.0
board = megaatmega2560
upload_speed = 115200

[env:esp32c3]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
board_build.f_cpu = 160000000L
upload_speed = 460800
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=0 -DARDUINO_USB_MODE=1

[env:mega2560_opt]
extends = env:mega2560
build_flags = ${env.build_flags} -DSENSOR_OPTIMIZED_SUITE

[env:esp32c3_opt]
extends = env:esp32c3
build_flags = ${env:esp32c3.build_flags} -DSENSOR_OPTIMIZED_SUITE

[env:mega2560_matched]
extends = env:mega2560
build_flags = ${env.build_flags} -DSENSOR_MATCHED_SUITE -fno-fast-math -ffp-contract=off

[env:esp32c3_matched]
extends = env:esp32c3
build_flags = ${env:esp32c3.build_flags} -DSENSOR_MATCHED_SUITE -fno-fast-math -ffp-contract=off

[env:mega2560_references]
extends = env:mega2560
build_flags = ${env.build_flags} -DSENSOR_REVISION_SUITE -fno-fast-math -ffp-contract=off

[env:esp32c3_references]
extends = env:esp32c3
build_flags = ${env:esp32c3.build_flags} -DSENSOR_REVISION_SUITE -fno-fast-math -ffp-contract=off

; S3-A: ESP32-S3 FH4R2, 4 MB flash, native USB Serial/JTAG, 240 MHz.
; PSRAM is not used. The computational fixture and V2 wire format are unchanged.
[env:esp32s3_references]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_qspi
board_build.partitions = default.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
upload_speed = 460800
build_flags = ${env.build_flags} -DSENSOR_REVISION_SUITE -DARDUINO_USB_CDC_ON_BOOT=0 -DARDUINO_USB_MODE=1 -fno-fast-math -ffp-contract=off
