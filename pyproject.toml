[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lut-native"
version = "0.15.0"
description = "Direct LUT training for memory-constrained KAN sensor calibration"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "torch>=2.0",
    "matplotlib>=3.5",
    "scipy>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]
