; PlatformIO alternative to flash.ps1
; Usage:
;   pip install platformio
;   cd hardware
;   pio run -e mega2560 -t upload          # flash Mega
;   pio run -e esp32c3  -t upload          # flash ESP32-C3
;   pio device monitor -b 115200           # serial monitor

[env:mega2560]
platform  = atmelavr
board     = megaatmega2560
framework = arduino
monitor_speed = 115200
upload_speed  = 115200

[env:esp32c3]
platform  = espressif32
board     = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed  = 921600
build_flags   =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
